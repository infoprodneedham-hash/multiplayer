<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Checkers Arena</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: {
              boardDark: '#1e293b',
              boardLight: '#334155',
              checkerRed: '#e11d48',
              checkerBlack: '#0f172a'
            }
          },
        },
      }
    </script>

    <!-- React 18 & Babel Standalone for single-file browser runtime -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #020617;
        background-image: 
          radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),

      .checker-piece {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.3), inset 0 -4px 6px rgba(0, 0, 0, 0.4);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .checker-piece:hover {
        transform: scale(1.05);
      }
      .crown-glow {
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
      }
    </style>
  </head>
  <body class="text-slate-100 min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white">
    <div id="root" class="flex flex-col min-h-screen"></div>

    <script type="text/babel" data-type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      import { getDatabase, ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

      const { useState, useEffect, useMemo, useRef } = React;

      // --- Firebase Configuration ---
      const firebaseConfig = {
        apiKey: "AIzaSyCPRIediD4e9OVAtKS_W4l9rl_mbRL2lkc",
        authDomain: "checkers-99.firebaseapp.com",
        projectId: "checkers-99",
        storageBucket: "checkers-99.firebasestorage.app",
        messagingSenderId: "529826802142",
        appId: "1:529826802142:web:68eb5309ced0ccfa37554f",
        databaseURL: "https://checkers-99-default-rtdb.firebaseio.com"
      };

      const fbApp = initializeApp(firebaseConfig);
      const auth = getAuth(fbApp);
      const db = getDatabase(fbApp);

      // --- Web Audio Procedural Sound Effects ---
      class SoundEffects {
        constructor() {
          this.ctx = null;
        }

        init() {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        playMove() {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        }

        playCapture() {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(420, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.16);
        }

        playKing() {
          this.init();
          if (!this.ctx) return;
          const notes = [440, 554.37, 659.25, 880];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const startTime = this.ctx.currentTime + (idx * 0.07);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.2, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.25);
          });
        }

        playVictory() {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const startTime = this.ctx.currentTime + (idx * 0.1);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.3, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.45);
          });
        }
      }

      const sfx = new SoundEffects();

      // --- Checkers Rules Engine ---
      const BOARD_SIZE = 8;

      function createInitialBoard() {
        const board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if ((r + c) % 2 === 1) {
              if (r < 3) board[r][c] = 'b';
              else if (r > 4) board[r][c] = 'r';
            }
          }
        }
        return board;
      }

      function isRed(piece) { return piece === 'r' || piece === 'R'; }
      function isBlack(piece) { return piece === 'b' || piece === 'B'; }
      function isKing(piece) { return piece === 'R' || piece === 'B'; }
      function getPieceOwner(piece) {
        if (!piece) return null;
        return isRed(piece) ? 'red' : 'black';
      }

      function getValidMovesForPiece(board, r, c, activeChainPiece = null) {
        const piece = board[r][c];
        if (!piece) return [];
        if (activeChainPiece && (activeChainPiece.r !== r || activeChainPiece.c !== c)) {
          return [];
        }

        const moves = [];
        const owner = getPieceOwner(piece);
        const directions = [];

        if (piece === 'r' || isKing(piece)) directions.push([-1, -1], [-1, 1]);
        if (piece === 'b' || isKing(piece)) directions.push([1, -1], [1, 1]);

        directions.forEach(([dr, dc]) => {
          const nr = r + dr;
          const nc = c + dc;

          // Regular slide moves (blocked if currently mid-chain)
          if (!activeChainPiece && nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
            if (!board[nr][nc]) {
              moves.push({ from: [r, c], to: [nr, nc], isJump: false });
            }
          }

          // Jump captures over opponent piece
          const jumpR = r + dr * 2;
          const jumpC = c + dc * 2;
          if (jumpR >= 0 && jumpR < BOARD_SIZE && jumpC >= 0 && jumpC < BOARD_SIZE) {
            const intermediate = board[nr][nc];
            const target = board[jumpR][jumpC];
            if (intermediate && getPieceOwner(intermediate) !== owner && !target) {
              moves.push({
                from: [r, c],
                to: [jumpR, jumpC],
                isJump: true,
                captured: [nr, nc]
              });
            }
          }
        });

        return moves;
      }

      function getAllValidMoves(board, turn, activeChainPiece = null) {
        let allMoves = [];

        if (activeChainPiece) {
          return getValidMovesForPiece(board, activeChainPiece.r, activeChainPiece.c, activeChainPiece)
            .filter(m => m.isJump);
        }

        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            const piece = board[r][c];
            if (piece && getPieceOwner(piece) === turn) {
              const pieceMoves = getValidMovesForPiece(board, r, c);
              allMoves.push(...pieceMoves);
            }
          }
        }

        // Standard Mandatory Jump Rule:
        const jumpMoves = allMoves.filter(m => m.isJump);
        if (jumpMoves.length > 0) {
          return jumpMoves;
        }
        return allMoves;
      }

      // --- Main React Component ---
      function App() {
        const [user, setUser] = useState(null);
        const [roomIdInput, setRoomIdInput] = useState('');
        const [roomId, setRoomId] = useState('');
        const [gameData, setGameData] = useState(null);
        const [selectedSquare, setSelectedSquare] = useState(null);
        const [notification, setNotification] = useState('');
        const [isJoining, setIsJoining] = useState(false);

        // Anonymous Authentication Init
        useEffect(() => {
          signInAnonymously(auth).catch(err => {
            console.error("Auth error:", err);
            if (err.code === 'auth/operation-not-allowed') {
              setNotification("Error: Anonymous sign-in is disabled in Firebase Console.");
            } else if (err.code === 'auth/unauthorized-domain') {
              setNotification("Error: Current domain not added to Firebase Authorized Domains.");
            } else {
              setNotification("Auth error: " + err.message);
            }
          });

          const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
            if (currentUser) setUser(currentUser);
          });
          return () => unsubscribe();
        }, []);

        // Listen for direct URL invites (?room=ABC123)
        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const roomFromUrl = params.get('room');
          if (roomFromUrl && user) {
            const cleanCode = roomFromUrl.toUpperCase();
            setRoomIdInput(cleanCode);
            joinRoom(cleanCode);
          }
        }, [user]);

        // Realtime Database listener
        useEffect(() => {
          if (!roomId || !user) return;

          const gameRef = ref(db, `checkers_games/${roomId}`);
          const unsubscribe = onValue(gameRef, (snapshot) => {
            if (snapshot.exists()) {
              const val = snapshot.val();
              setGameData(val);
            } else {
              setGameData(null);
              setNotification("Room not found or expired.");
            }
          }, (error) => {
            console.error("Database sync error:", error);
            if (error.message.includes('PERMISSION_DENIED')) {
              setNotification("Permission denied: Check Realtime Database rules for checkers_games.");
            } else {
              setNotification("Database connection error: " + error.message);
            }
          });

          return () => unsubscribe();
        }, [roomId, user]);

        // Auto-dismiss notifications
        useEffect(() => {
          if (notification) {
            const t = setTimeout(() => setNotification(''), 5000);
            return () => clearTimeout(t);
          }
        }, [notification]);

        const createRoom = async () => {
          if (!user) {
            setNotification("Connecting to game server... please wait a moment.");
            return;
          }
          setIsJoining(true);
          const newRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
          const initialBoard = createInitialBoard();

          const newGame = {
            id: newRoomCode,
            board: initialBoard,
            turn: 'red',
            players: {
              red: user.uid,
              black: null
            },
            status: 'waiting',
            winner: null,
            activeChain: null,
            captures: { red: 0, black: 0 },
            createdAt: Date.now()
          };

          try {
            await set(ref(db, `checkers_games/${newRoomCode}`), newGame);
            setRoomId(newRoomCode);
            setRoomIdInput(newRoomCode);
            window.history.replaceState(null, '', `?room=${newRoomCode}`);
            sfx.playMove();
          } catch (e) {
            console.error(e);
            if (e.message && e.message.includes('PERMISSION_DENIED')) {
              setNotification("Permission Denied: Ensure checkers_games rules are published.");
            } else {
              setNotification("Failed to create room: " + e.message);
            }
          } finally {
            setIsJoining(false);
          }
        };

        const joinRoom = async (codeToJoin) => {
          const targetCode = (codeToJoin || roomIdInput).trim().toUpperCase();
          if (!targetCode) {
            setNotification("Please enter a room code.");
            return;
          }
          if (!user) {
            setNotification("Connecting to server...");
            return;
          }
          setIsJoining(true);

          try {
            const gameRef = ref(db, `checkers_games/${targetCode}`);
            const snapshot = await get(gameRef);

            if (!snapshot.exists()) {
              setNotification("Room " + targetCode + " does not exist.");
              setIsJoining(false);
              return;
            }

            const current = snapshot.val();
            let updatedPlayers = { ...current.players };
            let updatedStatus = current.status;

            if (current.players.red === user.uid) {
              // Already red
            } else if (current.players.black === user.uid) {
              // Already black
            } else if (!current.players.black) {
              updatedPlayers.black = user.uid;
              updatedStatus = 'active';
            }

            await update(gameRef, {
              players: updatedPlayers,
              status: updatedStatus
            });

            setRoomId(targetCode);
            window.history.replaceState(null, '', `?room=${targetCode}`);
            sfx.playMove();
          } catch (err) {
            console.error(err);
            setNotification("Could not join room: " + err.message);
          } finally {
            setIsJoining(false);
          }
        };

        const playerRole = useMemo(() => {
          if (!gameData || !user) return 'spectator';
          if (gameData.players.red === user.uid) return 'red';
          if (gameData.players.black === user.uid) return 'black';
          return 'spectator';
        }, [gameData, user]);

        const isMyTurn = useMemo(() => {
          if (!gameData || gameData.status !== 'active') return false;
          return gameData.turn === playerRole;
        }, [gameData, playerRole]);

        const validMoves = useMemo(() => {
          if (!gameData || !gameData.board) return [];
          return getAllValidMoves(gameData.board, gameData.turn, gameData.activeChain || null);
        }, [gameData]);

        const selectedSquareMoves = useMemo(() => {
          if (!selectedSquare) return [];
          return validMoves.filter(
            m => m.from[0] === selectedSquare.r && m.from[1] === selectedSquare.c
          );
        }, [selectedSquare, validMoves]);

        const handleSquareClick = async (r, c) => {
          if (!isMyTurn || gameData.status !== 'active') return;

          const piece = gameData.board[r][c];

          // If clicking target destination
          if (selectedSquare) {
            const move = selectedSquareMoves.find(m => m.to[0] === r && m.to[1] === c);
            if (move) {
              await executeMove(move);
              return;
            }
          }

          // If selecting an own piece
          if (piece && getPieceOwner(piece) === playerRole) {
            if (gameData.activeChain && (gameData.activeChain.r !== r || gameData.activeChain.c !== c)) {
              setNotification("You must complete the continuous jump with the active piece.");
              return;
            }

            const movesForPiece = validMoves.filter(m => m.from[0] === r && m.from[1] === c);
            if (movesForPiece.length > 0) {
              setSelectedSquare({ r, c });
            } else {
              setNotification(validMoves.some(m => m.isJump) ? "Jump captures are mandatory!" : "This piece has no valid moves.");
            }
          } else {
            if (!gameData.activeChain) {
              setSelectedSquare(null);
            }
          }
        };

        const executeMove = async (move) => {
          if (!gameData || !roomId) return;

          const nextBoard = gameData.board.map(row => [...row]);
          const [fromR, fromC] = move.from;
          const [toR, toC] = move.to;
          let piece = nextBoard[fromR][fromC];

          nextBoard[fromR][fromC] = null;

          // King promotion check
          const promotedToKing = (!isKing(piece)) && (
            (piece === 'r' && toR === 0) || (piece === 'b' && toR === BOARD_SIZE - 1)
          );

          if (promotedToKing) {
            piece = piece === 'r' ? 'R' : 'B';
            sfx.playKing();
          } else if (move.isJump) {
            sfx.playCapture();
          } else {
            sfx.playMove();
          }

          nextBoard[toR][toC] = piece;

          // Remove captured piece
          let updatedCaptures = { ...(gameData.captures || { red: 0, black: 0 }) };
          if (move.isJump && move.captured) {
            const [capR, capC] = move.captured;
            nextBoard[capR][capC] = null;
            if (playerRole === 'red') updatedCaptures.red += 1;
            if (playerRole === 'black') updatedCaptures.black += 1;
          }

          // Check multi-jump chaining
          let nextActiveChain = null;
          let nextTurn = gameData.turn;

          if (move.isJump && !promotedToKing) {
            const followUpJumps = getValidMovesForPiece(nextBoard, toR, toC, { r: toR, c: toC })
              .filter(m => m.isJump);

            if (followUpJumps.length > 0) {
              nextActiveChain = { r: toR, c: toC };
            }
          }

          if (!nextActiveChain) {
            nextTurn = gameData.turn === 'red' ? 'black' : 'red';
          }

          // Win verification
          const opponentMoves = getAllValidMoves(nextBoard, nextTurn, null);
          let winner = null;
          let newStatus = gameData.status;

          if (opponentMoves.length === 0) {
            winner = gameData.turn;
            newStatus = 'finished';
            sfx.playVictory();
          }

          try {
            await update(ref(db, `checkers_games/${roomId}`), {
              board: nextBoard,
              turn: nextTurn,
              activeChain: nextActiveChain,
              status: newStatus,
              winner: winner,
              captures: updatedCaptures
            });
            setSelectedSquare(nextActiveChain ? { r: toR, c: toC } : null);
          } catch (err) {
            console.error(err);
            setNotification("Failed to submit move.");
          }
        };

        const handleResign = async () => {
          if (!gameData || gameData.status !== 'active') return;
          const opposingColor = playerRole === 'red' ? 'black' : 'red';
          await update(ref(db, `checkers_games/${roomId}`), {
            status: 'finished',
            winner: opposingColor
          });
        };

        const handleRematch = async () => {
          if (!roomId) return;
          await update(ref(db, `checkers_games/${roomId}`), {
            board: createInitialBoard(),
            turn: 'red',
            activeChain: null,
            status: 'active',
            winner: null,
            captures: { red: 0, black: 0 }
          });
          setSelectedSquare(null);
        };

        const copyShareLink = () => {
          const url = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
          navigator.clipboard.writeText(url);
          setNotification("Invite link copied to clipboard!");
        };

        return (
          <div className="flex flex-col min-h-screen">
            {/* Header */}
            <header className="w-full border-b border-slate-800/80 bg-slate-950/70 backdrop-blur-md sticky top-0 z-50">
              <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 via-rose-500 to-amber-500 flex items-center justify-center font-black text-xl shadow-lg shadow-rose-950/50">
                    🏁
                  </div>
                  <div>
                    <span className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                      Checkers<span className="text-rose-500">Live</span>
                    </span>
                    <span className="block text-[10px] text-slate-500 font-semibold tracking-wider uppercase">Cloud Multiplayer</span>
                  </div>
                </div>

                <div className="flex items-center space-x-3">
                  {roomId && (
                    <div className="flex items-center bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 space-x-2">
                      <span className="text-xs text-slate-400">ROOM:</span>
                      <span className="text-xs font-mono font-bold text-amber-400 tracking-wider">{roomId}</span>
                      <button 
                        onClick={copyShareLink} 
                        className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded transition">
                        Copy
                      </button>
                    </div>
                  )}
                  <div className="flex items-center space-x-2 text-xs font-semibold uppercase tracking-wider text-slate-400 bg-slate-900/90 px-3 py-1.5 rounded-full border border-slate-800">
                    <span className={`w-2 h-2 rounded-full ${user ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                    <span>{user ? 'Online' : 'Connecting'}</span>
                  </div>
                </div>
              </div>
            </header>

            {/* Notification Banner */}
            {notification && (
              <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-rose-600/90 backdrop-blur border border-rose-400 text-white px-5 py-2.5 rounded-xl shadow-2xl text-sm font-semibold animate-bounce max-w-md text-center">
                {notification}
              </div>
            )}

            {/* Main Stage */}
            <main className="flex-grow flex flex-col items-center justify-center p-4">
              {!roomId ? (
                <div className="w-full max-w-md bg-slate-900/90 border border-slate-800 p-8 rounded-3xl shadow-2xl shadow-black/80 backdrop-blur-sm text-center">
                  <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-3xl">
                    👑
                  </div>
                  <h2 className="text-2xl font-bold text-white mb-2">Checkers Arena</h2>
                  <p className="text-slate-400 text-sm mb-6">Play real-time 1v1 Checkers with cloud turn sync and mandatory jump enforcement.</p>

                  <div className="space-y-4">
                    <button
                      onClick={createRoom}
                      disabled={isJoining || !user}
                      className="w-full py-3.5 px-4 bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 font-bold rounded-xl shadow-lg shadow-rose-900/40 transition active:scale-[0.98] disabled:opacity-50">
                      Create New Match
                    </button>

                    <div className="flex items-center my-3 text-xs text-slate-500 uppercase tracking-widest font-semibold">
                      <div className="flex-grow border-t border-slate-800"></div>
                      <span className="px-3">or join match</span>
                      <div className="flex-grow border-t border-slate-800"></div>
                    </div>

                    <div className="flex space-x-2">
                      <input
                        type="text"
                        placeholder="ENTER ROOM CODE"
                        value={roomIdInput}
                        onChange={(e) => setRoomIdInput(e.target.value.toUpperCase())}
                        maxLength={6}
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center uppercase font-mono tracking-widest text-slate-100 placeholder-slate-600 focus:outline-none focus:border-rose-500"
                      />
                      <button
                        onClick={() => joinRoom(roomIdInput)}
                        disabled={isJoining || !roomIdInput || !user}
                        className="px-6 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl transition disabled:opacity-50">
                        Join
                      </button>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="w-full max-w-4xl flex flex-col lg:flex-row items-center justify-center gap-8">
                  {/* Left Column: Player Cards */}
                  <div className="w-full lg:w-64 flex flex-row lg:flex-col gap-4 justify-between">
                    {/* Red Card */}
                    <div className={`flex-1 p-4 rounded-2xl border transition-all ${
                      gameData?.turn === 'red' && gameData?.status === 'active'
                        ? 'bg-rose-950/40 border-rose-500/80 shadow-lg shadow-rose-950/50 ring-2 ring-rose-500/30'
                        : 'bg-slate-900/60 border-slate-800'
                    }`}>
                      <div className="flex items-center space-x-3 mb-2">
                        <div className="w-7 h-7 rounded-full bg-rose-600 border-2 border-rose-400 shadow-md flex items-center justify-center font-bold text-xs text-white">
                          R
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="text-xs font-semibold text-slate-400 uppercase">Red Team</p>
                          <p className="text-sm font-bold text-white truncate">
                            {gameData?.players?.red === user?.uid ? "You" : gameData?.players?.red ? "Opponent" : "Waiting..."}
                          </p>
                        </div>
                      </div>
                      <div className="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-800/80">
                        <span>Captured:</span>
                        <span className="font-bold text-rose-400">{gameData?.captures?.red || 0}</span>
                      </div>
                    </div>

                    {/* Black Card */}
                    <div className={`flex-1 p-4 rounded-2xl border transition-all ${
                      gameData?.turn === 'black' && gameData?.status === 'active'
                        ? 'bg-slate-800/60 border-amber-500/80 shadow-lg shadow-black/60 ring-2 ring-amber-500/30'
                        : 'bg-slate-900/60 border-slate-800'
                    }`}>
                      <div className="flex items-center space-x-3 mb-2">
                        <div className="w-7 h-7 rounded-full bg-slate-950 border-2 border-slate-600 shadow-md flex items-center justify-center font-bold text-xs text-slate-300">
                          B
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="text-xs font-semibold text-slate-400 uppercase">Black Team</p>
                          <p className="text-sm font-bold text-white truncate">
                            {gameData?.players?.black === user?.uid ? "You" : gameData?.players?.black ? "Opponent" : "Waiting for player..."}
                          </p>
                        </div>
                      </div>
                      <div className="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-800/80">
                        <span>Captured:</span>
                        <span className="font-bold text-amber-400">{gameData?.captures?.black || 0}</span>
                      </div>
                    </div>

                    {/* Desktop Match Controls */}
                    <div className="hidden lg:flex flex-col gap-2 pt-2">
                      <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800 text-center">
                        <span className="text-xs text-slate-400 uppercase tracking-wider block">Your Role</span>
                        <span className="text-sm font-bold capitalize text-white">
                          {playerRole === 'spectator' ? '👀 Spectator' : `${playerRole} Player`}
                        </span>
                      </div>

                      {playerRole !== 'spectator' && gameData?.status === 'active' && (
                        <button
                          onClick={handleResign}
                          className="w-full py-2 bg-slate-900 hover:bg-rose-950 border border-slate-800 hover:border-rose-800 text-rose-400 font-semibold rounded-xl text-xs transition">
                          Resign Match
                        </button>
                      )}

                      {gameData?.status === 'finished' && (
                        <button
                          onClick={handleRematch}
                          className="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-rose-950/40">
                          Play Again
                        </button>
                      )}
                    </div>
                  </div>

                  {/* Center Column: 8x8 Board */}
                  <div className="relative flex flex-col items-center">
                    {/* Status Pill */}
                    <div className="mb-4 flex items-center space-x-3 bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-2xl shadow-xl">
                      <div className={`w-3 h-3 rounded-full ${
                        gameData?.status === 'waiting' ? 'bg-amber-400 animate-ping' :
                        gameData?.status === 'finished' ? 'bg-emerald-400' :
                        gameData?.turn === 'red' ? 'bg-rose-500' : 'bg-slate-300'
                      }`} />
                      <span className="text-sm font-semibold text-slate-200">
                        {gameData?.status === 'waiting' && "Waiting for second player..."}
                        {gameData?.status === 'active' && (
                          isMyTurn ? "Your turn to move!" : `Waiting for ${gameData.turn} player...`
                        )}
                        {gameData?.status === 'finished' && (
                          `Game Over! Winner: ${gameData.winner?.toUpperCase()}`
                        )}
                      </span>
                    </div>

                    {/* Checkers Board */}
                    <div className="w-[340px] h-[340px] sm:w-[480px] sm:h-[480px] md:w-[540px] md:h-[540px] bg-slate-950 p-3 sm:p-4 rounded-3xl border-4 border-slate-800 shadow-2xl grid grid-cols-8 gap-0 select-none">
                      {gameData?.board ? (
                        gameData.board.map((row, r) =>
                          row.map((cell, c) => {
                            const isDarkSquare = (r + c) % 2 === 1;
                            const isSelected = selectedSquare?.r === r && selectedSquare?.c === c;
                            const isMoveTarget = selectedSquareMoves.some(m => m.to[0] === r && m.to[1] === c);
                            const isJumpTarget = selectedSquareMoves.some(m => m.to[0] === r && m.to[1] === c && m.isJump);

                            return (
                              <div
                                key={`${r}-${c}`}
                                onClick={() => handleSquareClick(r, c)}
                                className={`relative flex items-center justify-center cursor-pointer transition-colors ${
                                  !isDarkSquare ? 'bg-slate-800/40' : 'bg-slate-900'
                                } ${isSelected ? 'ring-4 ring-inset ring-amber-400/90' : ''}`}>
                                
                                {/* Target Highlights */}
                                {isMoveTarget && (
                                  <div className={`absolute z-20 rounded-full transition-transform animate-pulse ${
                                    isJumpTarget 
                                      ? 'w-6 h-6 sm:w-8 sm:h-8 border-4 border-rose-500 bg-rose-500/20' 
                                      : 'w-4 h-4 sm:w-5 sm:h-5 bg-emerald-400/80 ring-4 ring-emerald-400/20'
                                  }`} />
                                )}

                                {/* Checker Piece */}
                                {cell && (
                                  <div
                                    className={`checker-piece relative z-10 w-[78%] h-[78%] rounded-full flex items-center justify-center border-4 ${
                                      isRed(cell)
                                        ? 'bg-gradient-to-br from-rose-500 via-rose-600 to-rose-800 border-rose-400 text-white'
                                        : 'bg-gradient-to-br from-slate-800 via-slate-900 to-black border-slate-600 text-amber-400'
                                    } ${
                                      isMyTurn && getPieceOwner(cell) === playerRole ? 'hover:brightness-110 cursor-grab active:cursor-grabbing' : ''
                                    }`}>
                                    {isKing(cell) && (
                                      <span className="text-xl sm:text-2xl font-black crown-glow select-none">
                                        👑
                                      </span>
                                    )}
                                  </div>
                                )}
                              </div>
                            );
                          })
                        )
                      ) : (
                        <div className="col-span-8 flex items-center justify-center text-slate-500 font-medium">
                          Loading board...
                        </div>
                      )}
                    </div>

                    {/* Mobile Controls */}
                    <div className="lg:hidden flex items-center gap-3 mt-4 w-full justify-center">
                      {playerRole !== 'spectator' && gameData?.status === 'active' && (
                        <button
                          onClick={handleResign}
                          className="px-4 py-2 bg-slate-900 border border-slate-800 text-rose-400 font-semibold rounded-xl text-xs">
                          Resign
                        </button>
                      )}
                      {gameData?.status === 'finished' && (
                        <button
                          onClick={handleRematch}
                          className="px-4 py-2 bg-rose-600 text-white font-bold rounded-xl text-xs">
                          Rematch
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* Footer */}
            <footer className="w-full border-t border-slate-800/60 bg-slate-950/40 py-5 text-center text-xs text-slate-500 mt-auto">
              <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                <p>Standard 2-Player Checkers &bull; Mandatory Jumps &bull; Cloud Realtime Sync</p>
                <p className="text-slate-600">Powered by React &amp; Firebase Realtime Database</p>
              </div>
            </footer>
          </div>
        );
      }

      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
